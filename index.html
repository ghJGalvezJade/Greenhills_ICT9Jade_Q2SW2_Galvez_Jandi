<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <title>Q2 Seatwork 2</title>
      <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: url(https://images.squarespace-cdn.com/content/v1/664c7ae50eea9c731b37e817/51bf9a1b-c4fc-42b1-abe6-945af52780da/OBMC+MONTESSORI+AN+1+-+AY+2026+FA.jpg);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .background {
            flex: 1;
            padding: 40px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .contact-container {
            background-color: white;
            border-radius: 5px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 350px;
            padding: 15px;
            box-sizing: border-box;
            margin: auto;
        }

        h2 {
            text-align: center;
            font-size: 25px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .section-title {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .text-input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-family: Arial, sans-serif;
            font-size: 13px;
            box-sizing: border-box;
        }

        .textarea-input {
            resize: vertical;
        }

        .submit-btn {
            width: 100%;
            background-color: #0d6efd;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            font-size: 13px;
            cursor: pointer;
        }

        .submit-btn:hover {
            background-color: #0b5ed7;
        }

        .footer {
            background-color: #212529;
            color: white;
            padding: 9px;
            margin-top: 20px;
            font-size: 15px;
            max-width: 600px;
            width: 90%;
            margin-left: auto;
            margin-right: auto;
            text-align: center;
            border-radius: 8px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        @media (max-width: 767px) {
            .contact-container {
                margin-top: 25px;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRhGWMliic2yX4A8KaM5AP99wxYDDubpMTUsDhyHWKdYmoUUNZZYomypEc&s=10"
                alt="OBMC Logo"
                style="width:35px; height:35px; border-radius:50%;">
            </a>
            <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse" data-bs-target="#collapsibleNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="collapsibleNavbar">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="#">Contact Us</a>
                    </li>
                </ul>
            </div>
            <form class="d-flex">
                <input class="form-control me-2"
                type="search"
                placeholder="Search">
                <button class="btn btn-primary" type="button">
                    Search
                </button>
            </form>
        </div>
    </nav>
    <div class="background">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-5 col-lg-4">
                    <div class="contact-container">
                        <h2>Contact Us</h2>
                        <form>
                            <div class="form-group">
                                <label class="section-title">
                                    Full Name
                                </label>
                                <input type="text"
                                placeholder="Enter your full name"
                                class="text-input"
                                required>
                            </div>
                            <div class="form-group">
                                <label class="section-title">
                                    Email Address
                                </label>
                                <input type="email"
                                placeholder="Enter your email"
                                class="text-input"
                                required>
                            </div>
                            <div class="form-group">
                                <label class="section-title">
                                    Subject
                                </label>
                                <input type="text"
                                placeholder="Enter subject"
                                class="text-input"
                                required>
                            </div>
                            <div class="form-group">
                                <label class="section-title">
                                    Message
                                </label>
                                <textarea
                                placeholder="Type your message here"
                                rows="4"
                                class="text-input textarea-input"
                                required></textarea>
                            </div>
                            <button type="submit" class="submit-btn">
                                Send Message
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="footer">
        © 2026 OBMC | Created by Jandi Galvez 9-Jade
    </div>

</body>
</html>
